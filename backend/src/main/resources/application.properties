spring.application.name=fitness-system

spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitness}
spring.datasource.username=${DB_USERNAME:fitness}
spring.datasource.password=${DB_PASSWORD:fitness}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
spring.jackson.time-zone=UTC

logging.level.cz.unicorn.fitnesssystem=${LOG_LEVEL:INFO}