spring.application.name=fitness-system

spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitness}
spring.datasource.username=${DB_USERNAME:fitness}
spring.datasource.password=${DB_PASSWORD:fitness}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@localhost}

# Local-dev default only
app.otp.pepper=${OTP_PEPPER:local-dev-pepper}

server.port=${SERVER_PORT:8080}
spring.jackson.time-zone=UTC

logging.level.cz.unicorn.fitnesssystem=${LOG_LEVEL:INFO}