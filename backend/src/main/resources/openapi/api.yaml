openapi: 3.0.3
info:
  title: Fitness system API
  version: 0.1.0
servers:
  - url: /api

tags:
  - name: health
    description: Smoke test of the contract-first pipeline
  - name: members
    description: Member identity and devices
  - name: trainer-auth
    description: Trainer registration, login and sessions
  - name: groups
    description: Training groups, managed by their trainers
  - name: member-groups
    description: Joining, listing and leaving groups as a member

paths:
  /ping:
    $ref: './paths/health/ping.yaml'
  /members:
    $ref: './paths/member/members.yaml'
  /me:
    $ref: './paths/member/me.yaml'
  /trainer/register:
    $ref: './paths/trainer/trainer-register.yaml'
  /trainer/login/request:
    $ref: './paths/trainer/trainer-login-request.yaml'
  /trainer/login/verify:
    $ref: './paths/trainer/trainer-login-verify.yaml'
  /trainer/logout:
    $ref: './paths/trainer/trainer-logout.yaml'
  /trainer/me:
    $ref: './paths/trainer/trainer-me.yaml'
  /trainer/sessions:
    $ref: './paths/trainer/trainer-sessions.yaml'
  /trainer/sessions/{sessionId}:
    $ref: './paths/trainer/trainer-sessions-by-id.yaml'
  /trainer/groups:
    $ref: './paths/group/trainer-groups.yaml'
  /trainer/groups/{groupId}:
    $ref: './paths/group/trainer-groups-by-id.yaml'
  /trainer/groups/{groupId}/invite-code:
    $ref: './paths/group/trainer-groups-invite-code.yaml'
  /invites/{code}:
    $ref: './paths/group/invites-by-code.yaml'
  /invites/{code}/join:
    $ref: './paths/group/invites-join.yaml'

components:
  schemas:
    ErrorResponse:
      $ref: './schemas/common/ErrorResponse.yaml'
    Email:
      $ref: './schemas/common/Email.yaml'
    PingResponse:
      $ref: './schemas/health/PingResponse.yaml'
    KeyAlgorithm:
      $ref: './schemas/member/KeyAlgorithm.yaml'
    MemberIdentity:
      $ref: './schemas/member/MemberIdentity.yaml'
    MemberProfile:
      $ref: './schemas/member/MemberProfile.yaml'
    Nickname:
      $ref: './schemas/member/Nickname.yaml'
    DisplayName:
      $ref: './schemas/trainer/DisplayName.yaml'
    TrainerProfile:
      $ref: './schemas/trainer/TrainerProfile.yaml'
    TrainerSessionInfo:
      $ref: './schemas/trainer/TrainerSessionInfo.yaml'
    GroupName:
      $ref: './schemas/group/GroupName.yaml'
    GroupDescription:
      $ref: './schemas/group/GroupDescription.yaml'
    Timezone:
      $ref: './schemas/group/Timezone.yaml'
    CancelHours:
      $ref: './schemas/group/CancelHours.yaml'
    GroupRole:
      $ref: './schemas/group/GroupRole.yaml'
    TrainerGroup:
      $ref: './schemas/group/TrainerGroup.yaml'
    InviteCode:
      $ref: './schemas/group/InviteCode.yaml'
    InvitePreview:
      $ref: './schemas/group/InvitePreview.yaml'
    MemberGroup:
      $ref: './schemas/group/MemberGroup.yaml'
    CreditBalance:
      $ref: './schemas/credit/CreditBalance.yaml'

  securitySchemes:
    memberSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: >
        Signed request. Also requires X-Key-Id, X-Timestamp and X-Nonce.
        Canonical string: METHOD\n/path?query\nX-Timestamp\nX-Nonce\nbase64url(SHA-256(body)).
    trainerSession:
      type: apiKey
      in: cookie
      name: TRAINER_SESSION
      description: Opaque session token (HttpOnly; Secure; SameSite=Strict).