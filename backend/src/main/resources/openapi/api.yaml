openapi: 3.0.3
info:
  title: Fitness system API
  version: 0.1.0
servers:
  - url: /api

tags:
  - name: health
    description: Smoke test of the contract-first pipeline
  - name: members
    description: Member identity and devices (UC-01..09)

paths:
  /ping:
    $ref: './paths/health/ping.yaml'
  /members:
    $ref: './paths/member/members.yaml'

components:
  schemas:
    ErrorResponse:
      $ref: './schemas/common/ErrorResponse.yaml'
    PingResponse:
      $ref: './schemas/health/PingResponse.yaml'
    KeyAlgorithm:
      $ref: './schemas/member/KeyAlgorithm.yaml'
    MemberIdentity:
      $ref: './schemas/member/MemberIdentity.yaml'

  securitySchemes:
    memberSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: >
        BR-01 signed request. Also requires X-Key-Id, X-Timestamp and X-Nonce.
        Canonical string: METHOD\n/path?query\nX-Timestamp\nX-Nonce\nbase64url(SHA-256(body)).
    trainerSession:
      type: apiKey
      in: cookie
      name: TRAINER_SESSION
      description: BR-02 opaque session token (HttpOnly; Secure; SameSite=Strict).