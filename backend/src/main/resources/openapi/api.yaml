openapi: 3.0.3
info:
  title: Fitness system API
  version: 0.1.0
servers:
  - url: /api

tags:
  - name: health
    description: Smoke test of the contract-first pipeline

paths:
  /ping:
    get:
      tags: [health]
      operationId: ping
      summary: Returns a pong with the server time
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 32
      responses:
        '200':
          description: Pong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  schemas:
    PingResponse:
      type: object
      required: [message, serverTime]
      properties:
        message:
          type: string
          example: pong
        serverTime:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: VALIDATION
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'