openapi: 3.0.3
info:
  title: Fitness system API
  version: 0.1.0
servers:
  - url: /api

tags:
  - name: health
    description: Smoke test of the contract-first pipeline

paths:
  /ping:
    get:
      tags: [health]
      operationId: ping
      summary: Returns a pong with the server time
      security: []
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 32
      responses:
        '200':
          description: Pong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '400':
          $ref: './schemas/common/responses/BadRequest.yaml'

components:
  schemas:
    PingResponse:
      type: object
      required: [message, serverTime]
      properties:
        message:
          type: string
          example: pong
        serverTime:
          type: string
          format: date-time

    ErrorResponse:
      $ref: './schemas/common/ErrorResponse.yaml'

  securitySchemes:
    memberSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: >
        BR-01 signed request. Also requires X-Key-Id, X-Timestamp and X-Nonce.
        Canonical string: METHOD\n/path?query\nX-Timestamp\nX-Nonce\nbase64url(SHA-256(body)).
    trainerSession:
      type: apiKey
      in: cookie
      name: TRAINER_SESSION
      description: BR-02 opaque session token (HttpOnly; Secure; SameSite=Strict).