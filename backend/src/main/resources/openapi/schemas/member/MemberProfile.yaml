description: Profile of the signed-in member.
allOf:
  - $ref: './MemberIdentity.yaml'
  - type: object
    required: [deviceCount]
    properties:
      recoveryEmail:
        type: string
        nullable: true
        description: Masked recovery e-mail, null when none is linked.
        example: k***@example.com
      deviceCount:
        type: integer
        description: Number of active (not revoked) devices.
        example: 1
