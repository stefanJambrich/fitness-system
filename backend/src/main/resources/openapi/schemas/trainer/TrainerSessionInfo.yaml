type: object
description: A device the trainer is logged in on.
required: [id, remembered, createdAt, lastUsedAt, expiresAt, current]
properties:
  id:
    type: string
    format: uuid
  deviceLabel:
    $ref: '../common/DeviceLabel.yaml'
  remembered:
    type: boolean
  createdAt:
    type: string
    format: date-time
  lastUsedAt:
    type: string
    format: date-time
  expiresAt:
    type: string
    format: date-time
  current:
    type: boolean
    description: True for the session that made this request.