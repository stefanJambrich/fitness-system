description: A group as seen by one of its trainers.
allOf:
  - $ref: './GroupInfo.yaml'
  - type: object
    required: [inviteCode, defaultCancelHours, role, createdAt]
    properties:
      inviteCode:
        $ref: './InviteCode.yaml'
      defaultCancelHours:
        $ref: './CancelHours.yaml'
      role:
        $ref: './GroupRole.yaml'
      createdAt:
        type: string
        format: date-time
