description: >
  A group as seen by one of its members, with the member's credits in it. An active group has the next upcoming
  training (if any); a former group has the reason it ended instead.
allOf:
  - $ref: './GroupInfo.yaml'
  - type: object
    required: [credit]
    properties:
      credit:
        $ref: '../credit/CreditBalance.yaml'
      nextTraining:
        $ref: '../training/TrainingSummary.yaml'
      endReason:
        $ref: './MembershipEndReason.yaml'
