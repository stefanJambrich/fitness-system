title: OtpVerificationUserResponseDto
type: object
required:
  - user
  - auth_method
properties:
  user:
    $ref: '../user/UserBaseDto.yaml'
  auth_method:
    type: string
    enum: [DEVICE_KEY, SESSION_COOKIE]
    description: SESSION_COOKIE is used when the user has the TRAINER role, otherwise DEVICE_KEY is used.